<!DOCTYPE html>
<html>
<head>
    <title>AI Buddy</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f4f4f4;
            margin:40px;
        }

        .container{
            max-width:700px;
            margin:auto;
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.2);
        }

        h1{
            text-align:center;
        }

        #chat{
            border:1px solid #ccc;
            height:400px;
            overflow-y:auto;
            padding:10px;
            margin-bottom:15px;
        }

        input{
            width:78%;
            padding:10px;
            font-size:16px;
        }

        button{
            width:18%;
            padding:10px;
            font-size:16px;
            cursor:pointer;
        }

        .user{
            color:blue;
            margin:10px 0;
        }

        .ai{
            color:green;
            margin:10px 0;
        }
    </style>
</head>

<body>

<div class="container">

<h1>🤖 AI Buddy</h1>

<div id="chat"></div>

<input
type="text"
id="message"
placeholder="Type your message..."
>

<button onclick="sendMessage()">Send</button>

</div>

<script>

async function sendMessage(){

    let message=document.getElementById("message").value;

    if(message==="") return;

    document.getElementById("chat").innerHTML +=
    "<div class='user'><b>You:</b> "+message+"</div>";

    document.getElementById("message").value="";

    let response=await fetch("/chat",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            message:message
        })
    });

    let data=await response.json();

    document.getElementById("chat").innerHTML +=
    "<div class='ai'><b>AI Buddy:</b> "+data.reply+"</div>";

    document.getElementById("chat").scrollTop=
    document.getElementById("chat").scrollHeight;

}

document.getElementById("message").addEventListener("keypress",function(e){
    if(e.key==="Enter"){
        sendMessage();
    }
});

</script>

</body>
</html>
